<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #400000 0%, #250000 50%, #120000 100%);
            font-family: 'Cinzel', 'Georgia', serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Texto Cinematográfico */
        #ui-overlay {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            width: 100%;
        }

        .title {
            color: #ffffff;
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 0.3rem;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6), 
                         0 0 20px rgba(255, 0, 50, 0.8), 
                         0 0 40px rgba(255, 0, 50, 0.4);
            animation: pulseGlow 4s ease-in-out infinite;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% {
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.6), 0 0 20px rgba(255, 0, 50, 0.8), 0 0 40px rgba(255, 0, 50, 0.4);
                transform: scale(1);
            }
            50% {
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 35px rgba(255, 0, 50, 1), 0 0 60px rgba(255, 0, 50, 0.6);
                transform: scale(1.02);
            }
        }

        /* Tela de Início (Necessária para contornar o bloqueio de Autoplay de áudio) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #250000 0%, #050000 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease;
        }

        .enter-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            letter-spacing: 0.2rem;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(255, 0, 50, 0.2);
            text-transform: uppercase;
        }

        .enter-btn:hover {
            border-color: #ff3344;
            box-shadow: 0 0 25px rgba(255, 0, 50, 0.6);
            text-shadow: 0 0 5px #fff;
            transform: translateY(-2px);
        }

        /* Ajustes Responsivos */
        @media (max-width: 768px) {
            .title {
                font-size: 1.8rem;
                letter-spacing: 0.15rem;
            }
            .enter-btn {
                padding: 12px 30px;
                font-size: 0.9rem;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <div id="splash-screen">
        <button class="enter-btn" id="start-btn">LOL</button>
    </div>

    <div id="ui-overlay">
        <h1 class="title" id="main-title">LOL</h1>
    </div>

    <div id="canvas-container"></div>

<audio id="romantic-music" loop preload="auto">
    <source src="audio/CUCO-AmordeSiempre.mp3" type="audio/mpeg">
</audio>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        let scene, camera, renderer, composer;
        let mainHeart, starField, particleOrbit, secondaryHearts = [];
        
        const container = document.getElementById('canvas-container');
        const startBtn = document.getElementById('start-btn');
        const splash = document.getElementById('splash-screen');
        const title = document.getElementById('main-title');
        const music = document.getElementById('romantic-music');

        music.volume = 0.4;

        startBtn.addEventListener('click', () => {
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                title.style.opacity = '1';
                music.play().catch(err => console.log("Áudio bloqueado ou link inválido: ", err));
            }, 1500);
            init();
            animate();
        });

        function init() {
            // --- CENA & CÂMERA ---
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x1a0000, 0.035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 8);

            // --- RENDERIZADOR ---
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // --- ILUMINAÇÃO ---
            const ambientLight = new THREE.AmbientLight(0xff0022, 0.6);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.5);
            dirLight1.position.set(5, 10, 7);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xff3366, 1.5);
            dirLight2.position.set(-5, -5, 5);
            scene.add(dirLight2);

            const pointLight = new THREE.PointLight(0xff0033, 3, 15);
            pointLight.position.set(0, 0, 2);
            scene.add(pointLight);

            // --- CORAÇÃO PRINCIPAL ---
            const heartShape = new THREE.Shape();
            heartShape.moveTo(0, 0.5);
            heartShape.bezierCurveTo(0, 1.2, 0.8, 2.0, 2.0, 2.0);
            heartShape.bezierCurveTo(3.5, 2.0, 3.5, 0.6, 3.5, 0.6);
            heartShape.bezierCurveTo(3.5, -0.7, 2.2, -2.0, 0, -3.5);
            heartShape.bezierCurveTo(-2.2, -2.0, -3.5, -0.7, -3.5, 0.6);
            heartShape.bezierCurveTo(-3.5, 0.6, -3.5, 2.0, -2.0, 2.0);
            heartShape.bezierCurveTo(-0.8, 2.0, 0, 1.2, 0, 0.5);

            const extrudeSettings = {
                depth: 0.8,
                bevelEnabled: true,
                bevelSegments: 12,
                steps: 1,
                bevelSize: 0.4,
                bevelThickness: 0.4
            };

            const heartGeometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
            heartGeometry.center();
            heartGeometry.scale(0.5, 0.5, 0.5);

            // Material de Cristal / Vidro Premium
            const crystalMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xff0a33,
                emissive: 0x3a0005,
                roughness: 0.05,
                metalness: 0.1,
                transmission: 0.9,  
                ior: 1.55,          
                side: THREE.DoubleSide,
                depthWrite: true,
                clearcoat: 1.0,
                clearcoatRoughness: 0.05,
                thickness: 1.5
            });

            mainHeart = new THREE.Mesh(heartGeometry, crystalMaterial);
            scene.add(mainHeart);

            // --- ESTRELAS DE FUNDO ---
            const starCount = 400;
            const starGeometry = new THREE.BufferGeometry();
            const starPositions = new Float32Array(starCount * 3);

            for(let i=0; i < starCount * 3; i+=3) {
                starPositions[i] = (Math.random() - 0.5) * 40;
                starPositions[i+1] = (Math.random() - 0.5) * 40;
                starPositions[i+2] = -Math.random() * 20 - 5;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.06,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            starField = new THREE.Points(starGeometry, starMaterial);
            scene.add(starField);

            // --- PARTÍCULAS ORBITAIS ---
            const particleCount = 1500;
            const particleGeometry = new THREE.BufferGeometry();
            const particlePos = new Float32Array(particleCount * 3);
            
            for(let i=0; i < particleCount * 3; i+=3) {
                particlePos[i] = (Math.random() - 0.5) * 10;
                particlePos[i+1] = (Math.random() - 0.5) * 10;
                particlePos[i+2] = (Math.random() - 0.5) * 10;
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
            
            const pMat = new THREE.PointsMaterial({
                color: 0xff3355,
                size: 0.04,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particleOrbit = new THREE.Points(particleGeometry, pMat);
            scene.add(particleOrbit);

            // --- PÓS-PROCESSAMENTO (BLOOM) ---
            const renderPass = new THREE.RenderPass(scene, camera);
            const bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight), 
                2.2,  
                0.6,  
                0.15  
            );

            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            window.addEventListener('resize', onWindowResize);
        }

        // --- PEQUENOS CORAÇÕES FLUTUANTES ---
        function spawnFloatingHeart() {
            if (secondaryHearts.length > 40) {
                const oldHeart = secondaryHearts.shift();
                scene.remove(oldHeart);
            }

            const sShape = new THREE.Shape();
            sShape.moveTo(0, 0.2);
            sShape.bezierCurveTo(0, 0.5, 0.4, 0.9, 0.9, 0.9);
            sShape.bezierCurveTo(1.5, 0.9, 1.5, 0.3, 1.5, 0.3);
            sShape.bezierCurveTo(1.5, -0.3, 0.9, -0.8, 0, -1.4);
            sShape.bezierCurveTo(-0.9, -1.4, -1.5, -0.3, -1.5, 0.3);
            sShape.bezierCurveTo(-1.5, 0.3, -1.5, 0.9, -0.9, 0.9);
            sShape.bezierCurveTo(-0.4, 0.9, 0, 0.5, 0, 0.2);

            const sExtrude = { depth: 0.1, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.05, bevelThickness: 0.05 };
            const sGeom = new THREE.ExtrudeGeometry(sShape, sExtrude);
            sGeom.center();
            sGeom.scale(0.12, 0.12, 0.12);

            const sMat = new THREE.MeshPhongMaterial({
                color: 0xff1144,
                emissive: 0x220000,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            const pHeart = new THREE.Mesh(sGeom, sMat);
            
            pHeart.position.set(
                (Math.random() - 0.5) * 2.5,
                (Math.random() - 0.5) * 1.5 - 1.5,
                (Math.random() - 0.5) * 2
            );
            
            pHeart.userData = {
                speedY: 0.015 + Math.random() * 0.02,
                speedRot: (Math.random() - 0.5) * 0.03,
                seed: Math.random() * 100,
                life: 1.0
            };

            scene.add(pHeart);
            secondaryHearts.push(pHeart);
        }

        // --- ANIMACAO ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // 1. Rotação e Flutuação do Coração
            if (mainHeart) {
                mainHeart.rotation.y = elapsedTime * 0.4;
                mainHeart.rotation.x = Math.sin(elapsedTime * 0.2) * 0.2;
                mainHeart.position.y = Math.sin(elapsedTime * 1.5) * 0.25;

                // Batimento cardíaco simulado
                let pulseFactor = Math.sin(elapsedTime * 3.5); 
                if(pulseFactor > 0.7) {
                    let scale = 1.0 + (pulseFactor - 0.7) * 0.25;
                    mainHeart.scale.set(scale, scale, scale);
                } else {
                    mainHeart.scale.set(1, 1, 1);
                }
            }

            // 2. Órbita das Partículas
            if (particleOrbit) {
                const positions = particleOrbit.geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    const x = positions[i];
                    const z = positions[i+2];
                    const angle = 0.005 * (1 + (i % 3) * 0.1);
                    positions[i] = x * Math.cos(angle) - z * Math.sin(angle);
                    positions[i+2] = x * Math.sin(angle) + z * Math.cos(angle);
                    positions[i+1] += Math.sin(elapsedTime + i) * 0.003;
                }
                particleOrbit.geometry.attributes.position.needsUpdate = true;
            }

            // 3. Brilho das Estrelas
            if (starField) {
                starField.material.size = 0.05 + Math.abs(Math.sin(elapsedTime * 2)) * 0.03;
            }

            // 4. Corações Secundários
            if (Math.random() < 0.06) {
                spawnFloatingHeart();
            }

            for (let i = secondaryHearts.length - 1; i >= 0; i--) {
                const sh = secondaryHearts[i];
                sh.position.y += sh.userData.speedY;
                sh.position.x += Math.sin(elapsedTime + sh.userData.seed) * 0.008;
                sh.rotation.z += sh.userData.speedRot;
                sh.rotation.y += sh.userData.speedRot;

                sh.userData.life -= 0.004;
                sh.material.opacity = sh.userData.life;

                if (sh.userData.life <= 0) {
                    scene.remove(sh);
                    secondaryHearts.splice(i, 1);
                }
            }

            // 5. Câmera Cinemática
            camera.position.x = Math.sin(elapsedTime * 0.2) * 0.8;
            camera.position.y = Math.cos(elapsedTime * 0.2) * 0.4;
            camera.lookAt(0, 0, 0);

            composer.render();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
