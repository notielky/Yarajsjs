<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game Premium</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
    color:white;
    overflow:hidden;
}

.container{
    text-align:center;
    width:100%;
    max-width:600px;
    padding:20px;
}

h1{
    margin-bottom:10px;
    font-size:2.2rem;
    color:#4ade80;
    text-shadow:0 0 15px rgba(74,222,128,.5);
}

.info{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    font-size:1.1rem;
    font-weight:bold;
}

canvas{
    width:100%;
    max-width:500px;
    background:#111827;
    border:4px solid #4ade80;
    border-radius:15px;
    box-shadow:0 0 30px rgba(74,222,128,.3);
}

.controls{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(3,70px);
    justify-content:center;
    gap:10px;
}

.controls button{
    width:70px;
    height:70px;
    border:none;
    border-radius:15px;
    background:#22c55e;
    color:white;
    font-size:28px;
    cursor:pointer;
    transition:.2s;
}

.controls button:active{
    transform:scale(.9);
}

.hidden{
    visibility:hidden;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:10;
}

.game-over-box{
    background:#1e293b;
    padding:30px;
    border-radius:20px;
    text-align:center;
    animation:pop .4s ease;
}

.game-over-box h2{
    color:#ef4444;
    margin-bottom:10px;
}

.game-over-box button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
    cursor:pointer;
    font-size:16px;
}

@keyframes pop{
    from{
        transform:scale(.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

@media (min-width:768px){
    .controls{
        display:none;
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>🐍 Snake Game</h1>

    <div class="info">
        <span>Pontos: <span id="score">0</span></span>
        <span>Recorde: <span id="highScore">0</span></span>
    </div>

    <canvas id="game" width="500" height="500"></canvas>

    <div class="controls">
        <div class="hidden"></div>
        <button onclick="changeDirection('up')">⬆</button>
        <div class="hidden"></div>

        <button onclick="changeDirection('left')">⬅</button>
        <button onclick="changeDirection('down')">⬇</button>
        <button onclick="changeDirection('right')">➡</button>
    </div>
</div>

<div class="overlay" id="gameOverScreen">
    <div class="game-over-box">
        <h2>💀 Game Over</h2>
        <p id="finalScore"></p>
        <button onclick="restartGame()">Jogar Novamente</button>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 25;
const rows = canvas.width / box;

let snake;
let food;
let direction;
let score;
let game;
let highScore = localStorage.getItem("snakeHighScore") || 0;

document.getElementById("highScore").textContent = highScore;

function initGame(){
    snake = [{x:10,y:10}];
    direction = "RIGHT";
    score = 0;

    food = {
        x: Math.floor(Math.random()*rows),
        y: Math.floor(Math.random()*rows)
    };

    document.getElementById("score").textContent = score;
    document.getElementById("gameOverScreen").style.display = "none";

    clearInterval(game);
    game = setInterval(draw,120);
}

function playBeep(freq,duration){
    try{
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.frequency.value = freq;
        osc.type = "square";

        osc.start();

        gain.gain.exponentialRampToValueAtTime(
            0.00001,
            audioCtx.currentTime + duration/1000
        );

        osc.stop(audioCtx.currentTime + duration/1000);
    }catch(e){}
}

function draw(){

    ctx.fillStyle = "#111827";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // comida
    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc(
        food.x*box+box/2,
        food.y*box+box/2,
        box/2.5,
        0,
        Math.PI*2
    );
    ctx.fill();

    // cobra
    snake.forEach((segment,index)=>{

        ctx.fillStyle = index===0 ? "#4ade80" : "#22c55e";

        ctx.fillRect(
            segment.x*box+1,
            segment.y*box+1,
            box-2,
            box-2
        );
    });

    let headX = snake[0].x;
    let headY = snake[0].y;

    if(direction==="LEFT") headX--;
    if(direction==="UP") headY--;
    if(direction==="RIGHT") headX++;
    if(direction==="DOWN") headY++;

    // comer comida
    if(headX===food.x && headY===food.y){

        score++;
        document.getElementById("score").textContent = score;

        playBeep(700,100);

        food = {
            x: Math.floor(Math.random()*rows),
            y: Math.floor(Math.random()*rows)
        };

    }else{
        snake.pop();
    }

    const newHead = {
        x: headX,
        y: headY
    };

    // colisão parede
    if(
        headX < 0 ||
        headY < 0 ||
        headX >= rows ||
        headY >= rows ||
        collision(newHead,snake)
    ){
        gameOver();
        return;
    }

    snake.unshift(newHead);
}

function collision(head,array){
    for(let i=0;i<array.length;i++){
        if(head.x===array[i].x && head.y===array[i].y){
            return true;
        }
    }
    return false;
}

function gameOver(){

    clearInterval(game);

    playBeep(150,500);

    if(score > highScore){
        highScore = score;
        localStorage.setItem("snakeHighScore",highScore);
        document.getElementById("highScore").textContent = highScore;
    }

    document.getElementById("finalScore").innerHTML =
        "Pontuação final: <strong>"+score+"</strong>";

    document.getElementById("gameOverScreen").style.display = "flex";
}

function restartGame(){
    initGame();
}

document.addEventListener("keydown",(e)=>{

    if(e.key==="ArrowLeft" && direction!=="RIGHT")
        direction="LEFT";

    if(e.key==="ArrowUp" && direction!=="DOWN")
        direction="UP";

    if(e.key==="ArrowRight" && direction!=="LEFT")
        direction="RIGHT";

    if(e.key==="ArrowDown" && direction!=="UP")
        direction="DOWN";
});

function changeDirection(dir){

    if(dir==="left" && direction!=="RIGHT")
        direction="LEFT";

    if(dir==="up" && direction!=="DOWN")
        direction="UP";

    if(dir==="right" && direction!=="LEFT")
        direction="RIGHT";

    if(dir==="down" && direction!=="UP")
        direction="DOWN";
}

// suporte a swipe
let startX,startY;

canvas.addEventListener("touchstart",(e)=>{
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
});

canvas.addEventListener("touchend",(e)=>{

    let endX = e.changedTouches[0].clientX;
    let endY = e.changedTouches[0].clientY;

    let dx = endX - startX;
    let dy = endY - startY;

    if(Math.abs(dx) > Math.abs(dy)){

        if(dx > 0 && direction!=="LEFT")
            direction="RIGHT";

        else if(dx < 0 && direction!=="RIGHT")
            direction="LEFT";

    }else{

        if(dy > 0 && direction!=="UP")
            direction="DOWN";

        else if(dy < 0 && direction!=="DOWN")
            direction="UP";
    }
});

initGame();
</script>

</body>
</html>
